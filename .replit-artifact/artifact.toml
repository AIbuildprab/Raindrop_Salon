kind = "web"
previewPath = "/"
title = "Glam & Glow by Kiran"
version = "1.0.0"
id = "glam-glow"
router = "path"

[[integratedSkills]]
name = "nextjs"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "pnpm run dev"

[services.production]
build = [ "pnpm", "run", "build" ]
publicDir = "out"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"
