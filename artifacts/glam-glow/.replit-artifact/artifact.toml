kind = "web"
previewPath = "/"
title = "Glam & Glow by Kiran"
version = "1.0.0"
id = "artifacts/glam-glow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22176

[services.development]
run = "pnpm --filter @workspace/glam-glow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/glam-glow", "run", "build" ]
publicDir = "artifacts/glam-glow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22176"
BASE_PATH = "/"
